name: macOS build

# Builds the Mac app on Apple's own hardware, because the .dmg can only be
# produced by a Mac. Everything the build needs is either in the repository
# (the two speech models, ~148 MB) or downloaded below (the sherpa-onnx
# dylibs, which are 60 MB and do not belong in git).
#
# Two jobs, because a Mac is either Apple Silicon or Intel and one binary
# cannot serve both: transcribe-cpp links Metal on arm64 and CPU-only on
# x86_64, and the Rust standard library is per-architecture.
#
# The result is unsigned: Gatekeeper will warn the first time it is opened on
# someone else's Mac, and the answer to that is a Developer ID certificate,
# not a build setting. See README, "Building the Mac app".

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 148 MB of models live in the repository, so no model download step is
      # needed here. This only fetches the speech engine itself. The dylibs are
      # universal2, so the same two files serve both jobs.
      - name: Fetch the sherpa-onnx dylibs
        run: |
          set -euo pipefail
          VERSION=2.0.1
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VERSION}/sherpa-onnx-v${VERSION}-osx-universal2-shared.tar.bz2"
          TMP="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$TMP/sherpa.tar.bz2" "$URL"
          tar -xjf "$TMP/sherpa.tar.bz2" -C "$TMP" \
            "sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libsherpa-onnx-c-api.dylib" \
            "sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libonnxruntime.dylib"
          mkdir -p src-tauri/resources/sherpa
          cp "$TMP/sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libsherpa-onnx-c-api.dylib" \
             "$TMP/sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libonnxruntime.dylib" \
             src-tauri/resources/sherpa/
          lipo -info src-tauri/resources/sherpa/libsherpa-onnx-c-api.dylib
          lipo -info src-tauri/resources/sherpa/libonnxruntime.dylib
          ls -la src-tauri/resources/sherpa/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: bun install

      - name: Build the app and the dmg
        env:
          # Ad-hoc signature. Without a Developer ID the app cannot be
          # notarised, and an ad-hoc signature is still required for arm64
          # binaries to run at all.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles app,dmg \
            --config '{"bundle":{"macOS":{"minimumSystemVersion":"11.0","hardenedRuntime":false,"entitlements":"Entitlements.plist"}}}'

      - name: Verify the bundle contains everything it needs
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Voice Transcriber.app"
          test -d "$APP" || { echo "the .app was not produced"; exit 1; }
          RES="$APP/Contents/Resources"
          for f in \
            "$RES/resources/sherpa/libsherpa-onnx-c-api.dylib" \
            "$RES/resources/sherpa/libonnxruntime.dylib" \
            "$RES/resources/models/encoder.int8.onnx" \
            "$RES/resources/models/decoder.int8.onnx" \
            "$RES/resources/models/joiner.int8.onnx" \
            "$RES/resources/models/tokens.txt" \
            "$RES/resources/models/whisper/base-encoder.int8.onnx" \
            "$RES/resources/models/whisper/base-decoder.int8.onnx" \
            "$RES/resources/models/whisper/base-tokens.txt"
          do
            test -f "$f" || { echo "missing from the bundle: $f"; exit 1; }
            echo "ok $f"
          done
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
            "$APP/Contents/Info.plist"
          # The web UI is not in Contents/Resources: Tauri compiles
          # `frontendDist` into the executable, so `dist/` is the last place it
          # exists as files. Check it there — if the stylesheet is missing, or
          # still wrapped in cascade layers that older WebKit ignores, the
          # window opens as an unstyled wall of boxes.
          test -f dist/index.html || { echo "the built frontend is missing"; exit 1; }
          ls dist/assets/*.css >/dev/null 2>&1 || { echo "no stylesheet was built"; exit 1; }
          ls dist/assets/*.js  >/dev/null 2>&1 || { echo "no script was built"; exit 1; }
          # Every construct below is unsupported on the WKWebView that macOS
          # 10.15-12 ship, and each one fails loudly: a rule whose selector uses
          # :is() is dropped whole, and an unregistered --tw-border-style means
          # no border is ever painted.
          for banned in '@layer' ':is(' ':where(' '@property'; do
            if grep -q -- "$banned" dist/assets/*.css; then
              echo "the stylesheet still contains $banned, which old WebKit cannot apply"
              exit 1
            fi
          done
          grep -q -- '--color-background' dist/assets/*.css \
            || { echo "the theme tokens are missing from the stylesheet"; exit 1; }
          grep -q 'html{background-color' dist/assets/*.css \
            || { echo "the opaque window fallback is missing"; exit 1; }
          echo "ok the web UI is free of @layer/:is/:where/@property and carries the theme"
          # Prove the binary really is the architecture we asked for: an
          # Intel build that silently came out arm64 would only fail on the
          # user's machine.
          lipo -info "$APP/Contents/MacOS/Voice Transcriber"
          # Not fatal: an ad-hoc signature is all we can produce without a
          # Developer ID, and the point of this step is to prove the bundle is
          # complete, not to prove it is signed.
          codesign --verify --verbose=2 "$APP" || echo "warning: the bundle is not signed"

      - name: Upload the dmg
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranscriber-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
