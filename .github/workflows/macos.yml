name: macOS build

# Builds the Mac app on Apple's own hardware, because the .dmg can only be
# produced by a Mac. Everything the build needs is either in the repository
# (the two speech models, ~148 MB) or downloaded below (the sherpa-onnx
# dylibs, which are 60 MB and do not belong in git).
#
# The result is an unsigned build: Gatekeeper will warn the first time it is
# opened on someone else's Mac, and the answer to that is a Developer ID
# certificate, not a build setting. See README, "Opening the Mac build".

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 148 MB of models live in the repository, so no model download step is
      # needed here. This only fetches the speech engine itself.
      - name: Fetch the sherpa-onnx dylibs
        run: |
          set -euo pipefail
          VERSION=2.0.1
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VERSION}/sherpa-onnx-v${VERSION}-osx-universal2-shared.tar.bz2"
          TMP="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$TMP/sherpa.tar.bz2" "$URL"
          tar -xjf "$TMP/sherpa.tar.bz2" -C "$TMP" \
            "sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libsherpa-onnx-c-api.dylib" \
            "sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libonnxruntime.dylib"
          mkdir -p src-tauri/resources/sherpa
          cp "$TMP/sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libsherpa-onnx-c-api.dylib" \
             "$TMP/sherpa-onnx-v${VERSION}-osx-universal2-shared/lib/libonnxruntime.dylib" \
             src-tauri/resources/sherpa/
          # Both are universal2, so one copy serves Intel and Apple Silicon.
          lipo -info src-tauri/resources/sherpa/libsherpa-onnx-c-api.dylib
          lipo -info src-tauri/resources/sherpa/libonnxruntime.dylib
          ls -la src-tauri/resources/sherpa/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-aarch64

      - name: Install frontend dependencies
        run: bun install

      - name: Build the app and the dmg
        env:
          # Ad-hoc signature. Without a Developer ID the app cannot be
          # notarised, and an ad-hoc signature is still required for arm64
          # binaries to run at all.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npx tauri build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config '{"bundle":{"macOS":{"minimumSystemVersion":"11.0","hardenedRuntime":false,"entitlements":"Entitlements.plist"}}}'

      - name: Verify the bundle contains everything it needs
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Voice Transcriber.app"
          test -d "$APP" || { echo "the .app was not produced"; exit 1; }
          RES="$APP/Contents/Resources"
          for f in \
            "$RES/resources/sherpa/libsherpa-onnx-c-api.dylib" \
            "$RES/resources/sherpa/libonnxruntime.dylib" \
            "$RES/resources/models/encoder.int8.onnx" \
            "$RES/resources/models/decoder.int8.onnx" \
            "$RES/resources/models/joiner.int8.onnx" \
            "$RES/resources/models/tokens.txt" \
            "$RES/resources/models/whisper/base-encoder.int8.onnx" \
            "$RES/resources/models/whisper/base-decoder.int8.onnx" \
            "$RES/resources/models/whisper/base-tokens.txt"
          do
            test -f "$f" || { echo "missing from the bundle: $f"; exit 1; }
            echo "ok $f"
          done
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
            "$APP/Contents/Info.plist"
          # Not fatal: an ad-hoc signature is all we can produce without a
          # Developer ID, and the point of this step is to prove the bundle is
          # complete, not to prove it is signed.
          codesign --verify --verbose=2 "$APP" || echo "warning: the bundle is not signed"

      - name: Upload the dmg
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranscriber-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
